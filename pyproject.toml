[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sadi-ai-research-engine"
version = "0.3.0"
description = "Saudi Exchange research engine with fail-closed evidence, provenance, and market adapters"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Samir Rashed Shaheen" }]
keywords = ["saudi-exchange", "tadawul", "evidence", "financial-research", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["cryptography==46.0.0", "tzdata==2026.3"]

[project.optional-dependencies]
test = ["jsonschema==4.25.1"]

[project.urls]
Repository = "https://github.com/mohsamir7122/sadi...AI"
Documentation = "https://github.com/mohsamir7122/sadi...AI/blob/main/README.md"
Issues = "https://github.com/mohsamir7122/sadi...AI/issues"

[project.scripts]
kubo = "kubo.cli_v3:main"
kubo-data-foundation = "kubo.data_foundation_cli:main"
sadi-ai = "kubo.saudi_cli:main"
sadi-nightly = "kubo.saudi_nightly_cli:main"
sadi-holdout-score = "kubo.saudi_holdout_cli:main"
sadi-post-open = "kubo.saudi_post_open_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
